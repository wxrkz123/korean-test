<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOPIK 刷题本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one exam column like the booklet (max 46rem), a sticky answer bar on top,
   a question-number sheet beside it on wide screens; the dictionary floats over the text. */
:root{
  --paper:#f3f4f7; --sheet:#ffffff; --ink:#1b2130; --muted:#5b6475; --line:#dcdfe6; --soft:#eef0f4;
  --accent:#2b4fbf; --accent-ink:#ffffff; --accent-soft:#e7ecfb;
  --ok:#17805a; --ok-bg:#e3f3eb; --bad:#c23a30; --bad-bg:#fbe8e6;
  --mark:#ffe26a; --mark-soft:#fff4bf; --shadow:0 10px 30px rgba(22,30,50,.16);
  --f-ko:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-ui:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111419; --sheet:#191d25; --ink:#e5e8ee; --muted:#9ba4b4; --line:#2d333e; --soft:#222732;
  --accent:#8ba5ff; --accent-ink:#0d1220; --accent-soft:#232c48;
  --ok:#52c48f; --ok-bg:rgba(82,196,143,.15); --bad:#ff7c70; --bad-bg:rgba(255,124,112,.15);
  --mark:rgba(255,214,10,.38); --mark-soft:rgba(255,214,10,.17); --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111419; --sheet:#191d25; --ink:#e5e8ee; --muted:#9ba4b4; --line:#2d333e; --soft:#222732;
  --accent:#8ba5ff; --accent-ink:#0d1220; --accent-soft:#232c48;
  --ok:#52c48f; --ok-bg:rgba(82,196,143,.15); --bad:#ff7c70; --bad-bg:rgba(255,124,112,.15);
  --mark:rgba(255,214,10,.38); --mark-soft:rgba(255,214,10,.17); --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:72rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:52px;flex-wrap:wrap;padding-block:6px}
.brand{font-weight:700;text-decoration:none;color:var(--ink);font-size:16px;letter-spacing:.01em;white-space:nowrap}
.brand .ko{font-family:var(--f-ko);color:var(--accent)}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:8px;font-size:14px;white-space:nowrap}
.nav a[aria-current="page"]{color:var(--ink);background:var(--soft);font-weight:500}
.nav .n{font-family:var(--f-num);font-size:12px;margin-left:3px;color:var(--muted)}
main{padding-block:20px 64px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.25;margin:0 0 8px;text-wrap:balance}
h2{font-size:18px;margin:0 0 12px;text-wrap:balance}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;text-decoration:none;color:var(--ink);font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
/* home */
.intro{display:grid;gap:14px;margin-bottom:28px;max-width:46rem}
.intro p{margin:0}
.demo{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.demo .ex{font-family:var(--f-ko);font-size:18px;line-height:1.9}
.omr{font-family:var(--f-ko);letter-spacing:.2em;color:var(--muted)}
.sync{font-size:13px;color:var(--muted)}
.list{display:grid;gap:10px;max-width:46rem}
.exam{display:grid;grid-template-columns:auto 1fr auto;gap:6px 16px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.exam .t{font-weight:700;font-size:17px;white-space:nowrap}
.exam .t small{display:block;font-weight:400;font-size:12px;color:var(--muted);font-family:var(--f-ko)}
.exam .meter{min-width:0}
.track{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .g{background:var(--ok)} .track .r{background:var(--bad)}
.exam .stat{font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.exam .acts{display:flex;gap:6px}
@media (max-width:560px){.exam{grid-template-columns:1fr auto}.exam .meter{grid-column:1/-1;order:3}}
/* exam view */
.xgrid{display:grid;grid-template-columns:minmax(0,46rem) 15rem;gap:24px;align-items:start}
@media (max-width:1000px){.xgrid{grid-template-columns:minmax(0,1fr)}.side{order:-1}}
.xhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.xhead .ttl{font-weight:700;font-size:17px}
.xhead .ttl span{font-family:var(--f-ko);font-weight:600;color:var(--muted);font-size:14px;margin-left:6px}
.xhead .score{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,3vw,28px);display:grid;gap:16px;min-width:0}
.ins{font-family:var(--f-ko);font-weight:700;font-size:16px;line-height:1.7}
.ko{font-family:var(--f-ko);font-size:18px;line-height:1.95;word-break:keep-all;overflow-wrap:anywhere}
.ko p{margin:0}
.ko p+p{margin-top:.35em}
.passage{border:1px solid var(--ink);border-radius:2px;padding:14px 18px}
.passage p{text-indent:1em}
.undisc{border:1px dashed var(--muted);border-radius:6px;padding:16px;text-align:center;font-size:15px;line-height:1.7;color:var(--muted)}
.undisc b{font-family:var(--f-ko);color:var(--ink)}
.qline{display:flex;gap:6px;align-items:baseline}
.qn{font-family:var(--f-ko);font-weight:700;font-size:18px;white-space:nowrap}
.boxed{border:1px solid var(--ink);padding:10px 16px;border-radius:2px}
.bogi{text-align:center;font-family:var(--f-ko);font-size:14px;color:var(--muted);margin-bottom:2px}
.poster{border:2px solid var(--line);border-radius:12px;padding:16px 20px;background:linear-gradient(180deg,var(--soft),var(--sheet));text-align:center}
.poster p.li{text-align:left}
.poster p:first-child{font-weight:700}
.chart{background:#fff;border-radius:10px;padding:8px;border:1px solid var(--line);max-width:100%}
.chart img{display:block;width:100%;height:auto}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer}
.opt:hover{background:var(--soft)}
.opt .ko{font-size:17px;line-height:1.8;min-width:0}
.bub{flex:none;width:30px;height:30px;margin-top:2px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-num);font-size:14px;font-weight:500;background:var(--sheet)}
.opt.chosen .bub{background:var(--ink);color:var(--sheet)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.right .bub{border-color:var(--ok);background:var(--ok);color:var(--sheet)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .bub{border-color:var(--bad);background:var(--bad);color:var(--sheet)}
.answered .opt{cursor:default}
.answered .opt:hover{background:transparent}
.answered .opt.right:hover{background:var(--ok-bg)} .answered .opt.wrong:hover{background:var(--bad-bg)}
.fb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:500;padding:10px 14px;border-radius:10px}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb .btn{margin-left:auto}
.hint{font-size:13px;color:var(--muted)}
.qnav{display:flex;gap:10px;justify-content:space-between;align-items:center}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.side .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.cells button{aspect-ratio:1;min-width:0;border:1px solid var(--line);background:var(--sheet);border-radius:6px;font-family:var(--f-num);font-size:11px;cursor:pointer;padding:0;color:var(--muted)}
.cells .ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cells .bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cells .skip{border-style:dashed;opacity:.5}
.cells .cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
@media (max-width:1000px){.side{position:static}.side.fold .cells,.side.fold .legend{display:none}}
.sidebar-toggle{display:none}
@media (max-width:1000px){.sidebar-toggle{display:inline-flex}}
/* words */
.w{cursor:help;border-radius:3px;transition:background-color .12s}
@media (hover:hover){.w:hover{background:var(--accent-soft)}}
.w.saved{background:var(--mark-soft);box-shadow:inset 0 -.32em 0 var(--mark)}
.w.on{background:var(--accent-soft)}
.ul{text-decoration:underline;text-underline-offset:.28em;text-decoration-thickness:1px}
.blank{white-space:nowrap}
.gap{display:inline-block;width:5.5em}
.mk{font-weight:600;white-space:nowrap}
/* popover */
.pop{position:absolute;z-index:40;width:min(23rem,calc(100vw - 24px));background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:grid;gap:10px;font-size:14px}
.pop.sheet{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;border-radius:16px 16px 0 0;max-height:70vh;overflow:auto;padding:14px max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.pop .hd{display:flex;align-items:center;gap:8px}
.pop .sf{font-family:var(--f-ko);font-size:15px;color:var(--muted)}
.pop .x{margin-left:auto;border:0;background:var(--soft);border-radius:8px;width:30px;height:30px;cursor:pointer}
.pop .row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
.pop .lem{font-family:var(--f-ko);font-size:19px;font-weight:600;line-height:1.4}
.pop .zh{grid-column:1;font-size:15px;line-height:1.5}
.pop .star{grid-row:1/3;grid-column:2;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;white-space:nowrap;align-self:center}
.pop .star.on{background:var(--mark-soft);border-color:var(--mark)}
.pop .sec{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:8px}
.pop .sh{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.pop .gl{font-family:var(--f-ko);font-weight:600;font-size:16px}
.pop .ft{display:flex;gap:12px;font-size:13px}
/* lists */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1}
.vlist{display:grid;gap:10px;max-width:46rem}
.vitem{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.vitem .k{font-family:var(--f-ko);font-size:20px;font-weight:600}
.vitem .k .ty{font-family:var(--f-ui);font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:3px}
.vitem .zh{grid-column:1;font-size:15px}
.hidezh .vitem .zh{color:transparent;background:var(--soft);border-radius:6px;cursor:pointer;user-select:none}
.hidezh .vitem .zh.show{color:inherit;background:transparent}
.vitem .cx{grid-column:1/-1;font-family:var(--f-ko);font-size:14px;color:var(--muted);line-height:1.7}
.vitem .cx b{color:var(--ink);font-weight:600;background:var(--mark-soft)}
.vitem .src{grid-column:1/-1;font-size:12px;color:var(--muted)}
.vitem .del{grid-row:1/3;grid-column:2;align-self:start}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted);max-width:46rem}
.wl{display:grid;gap:8px;max-width:46rem}
.witem{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.witem .meta{font-size:13px;color:var(--muted)}
.witem .sn{font-family:var(--f-ko);font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res{display:grid;gap:14px}
.big{font-family:var(--f-num);font-size:44px;line-height:1;font-weight:500}
.copybox{width:100%;min-height:8rem;font-family:var(--f-ko);font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--sheet);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:99px;font-size:14px;z-index:50;box-shadow:var(--shadow)}
.loading{padding:40px 0;color:var(--muted)}
/* translation & explanation */
.zh{font-family:var(--f-ui);font-size:14.5px;line-height:1.7;color:var(--muted);margin:2px 0 10px;word-break:normal;overflow-wrap:anywhere}
.zh:last-child{margin-bottom:0}
.ocol{display:flex;flex-direction:column;min-width:0;gap:1px}
.opt .zh{font-size:13.5px;margin:0}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.exp{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:15px;line-height:1.75}
.exp .lab{font-weight:700;color:var(--accent);margin-right:6px}
.expd{display:grid;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.expd p{margin:0}
.expd b{color:var(--ink);margin-right:4px}
.expd .koq{font-family:var(--f-ko);font-size:15.5px;color:var(--ink)}
.eo{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.eo .c{font-family:var(--f-num);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--muted);color:var(--muted);margin-top:2px}
.eo.ok .c{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.eo.ok{color:var(--ink)}
.eo.no{color:var(--muted)}
/* writing */
:root{--c2:#c9741f;--gj:#e6a4a4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c2:#f0a35e;--gj:#7a4545}}
:root[data-theme="dark"]{--c2:#f0a35e;--gj:#7a4545}
.wtop{display:grid;gap:12px;max-width:46rem;margin-bottom:22px}
.wtop p{margin:0}
.wtypes{display:grid;gap:16px;max-width:46rem}
.wsec{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.wsec .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wsec .no{font-family:var(--f-ko);font-weight:700;font-size:19px}
.wsec .nm{font-weight:700;font-size:16px}
.wsec .pt{font-size:13px;color:var(--muted)}
details.guide summary{cursor:pointer;color:var(--accent);font-size:14px;width:max-content;max-width:100%}
details.guide .expd{margin-top:8px;padding-top:8px;font-size:14.5px}
.witems{display:grid;gap:6px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-decoration:none;color:var(--ink);padding:8px 12px;border-radius:10px;border:1px solid var(--line)}
.wrow:hover{border-color:var(--muted)}
.wrow .kt{font-family:var(--f-ko);font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .zt{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11.5px;border-radius:6px;padding:0 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;line-height:1.6}
.tag.real{border-color:var(--accent);color:var(--accent)}
.wrow .st{grid-row:1/3;grid-column:2;font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.wrow .st.ok{color:var(--ok)}
.notice{border:2px solid var(--line);border-radius:12px;padding:16px clamp(14px,3vw,22px)}
.notice .hd{text-align:center;font-weight:700}
.wbk{display:inline-block;min-width:5.5em;padding:0 .4em;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:600;text-align:center;line-height:1.5;text-indent:0}
.wbk.filled{min-width:0;font-weight:500;color:var(--ink);background:var(--accent-soft);border-radius:4px 4px 0 0;text-align:left}
.wbk.ans{background:var(--ok-bg);border-bottom-color:var(--ok)}
.notice p.mt{font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.notice p.rx{background:var(--soft);border-radius:10px;padding:2px 12px;margin-right:12%}
.ctext{border:1px dashed var(--line);border-radius:10px;padding:10px 14px}
.ctext .clab{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.ctext .ko{font-size:16px;line-height:1.8}
.ctext p.hd{font-weight:700;margin-top:6px}
details.practice{border-top:1px dashed var(--line);padding-top:14px}
details.practice>summary{cursor:pointer;font-weight:600;color:var(--accent);width:max-content;max-width:100%}
.practice .ansbox{border-top:0;padding-top:12px}
.practice .ai{margin-top:12px}
.bullets{margin:8px 0 0;padding-left:1.3em}
.bullets li+li{margin-top:2px}
.ansbox{display:grid;gap:14px;border-top:1px dashed var(--line);padding-top:16px}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.field .mk2{font-family:var(--f-ko);color:var(--accent);font-size:18px}
textarea.wt{width:100%;font-family:var(--f-ko);font-size:17px;line-height:1.85;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sheet);color:var(--ink);resize:vertical;min-height:3.2em}
textarea.wt.sm{font-family:var(--f-ui);font-size:14.5px;line-height:1.6}
textarea.wt:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.cnt{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.cnt b{font-family:var(--f-num);font-weight:500;font-size:15px;color:var(--ink)}
.cnt.ok b{color:var(--ok)} .cnt.over b{color:var(--bad)}
.meter2{flex:1;min-width:140px;height:8px;border-radius:99px;background:var(--soft);position:relative;overflow:hidden}

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
'use strict';
const ORDER = [35, 37, 41, 47, 52, 64, 83, 91, 96, 102];
const CIRC = ['①', '②', '③', '④'];
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const touch = window.matchMedia('(hover: none)').matches;
let INDEX = null, DICT = null;
const EX = {};

/* ---------------- storage: browser first, private account copy when available ---------------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } }
};
const S = { progress: LS.get('topik.progress', {}), vocab: LS.get('topik.vocab', {}), pos: LS.get('topik.pos', {}), write: LS.get('topik.write', {}), wfb: LS.get('topik.wfb', {}) };
const SYNCED = ['progress', 'vocab', 'write', 'wfb'];
let remote = null, syncState = 'local';
const wq = {}; SYNCED.forEach(n => { wq[n] = { busy: false, dirty: false, timer: 0 }; });
function mergeItems(a, b) { const o = Object.assign({}, a); for (const k in b) { if (!o[k] || (b[k] && (b[k].t || 0) > (o[k].t || 0))) o[k] = b[k]; } return o; }
function pruneVocab(v) { const cut = Date.now() - 60 * 864e5; for (const k in v) if (v[k] && v[k].d && v[k].t < cut) delete v[k]; return v; }
function persist(name) { LS.set('topik.' + name, S[name]); if (remote) { const q = wq[name]; clearTimeout(q.timer); q.timer = setTimeout(() => flush(name), 1200); } }
async function flush(name) {
  const q = wq[name]; if (!remote) return;
  if (q.busy) { q.dirty = true; return; }
  q.busy = true;
  try { await remote.refs[name].set({ items: S[name], v: 1 }); }
  catch (e) {
    q.busy = false;
    if (e && e.code === 'unavailable' && !q.retried) { q.retried = true; setTimeout(() => flush(name), 1500 + Math.random() * 1500); return; }
    remote = null; syncState = 'local'; renderSync(); return;
  }
  q.busy = false; q.retried = false;
  if (q.dirty) { q.dirty = false; flush(name); }
}
async function initRemote() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const timeout = new Promise(res => setTimeout(() => res(null), 10000));
    const [db, user] = await Promise.all([Promise.race([window.claude.use('db'), timeout]), Promise.race([window.claude.use('user'), timeout])]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const refs = {}; SYNCED.forEach(n => { refs[n] = db.doc('data/users/' + uid + '/' + n); });
    const snaps = await Promise.race([Promise.all(SYNCED.map(n => refs[n].get())), timeout]);
    if (!snaps) return;
    remote = { refs };
    SYNCED.forEach((name, i) => {
      const r = (snaps[i].exists && snaps[i].data() && snaps[i].data().items) || {};
      const merged = mergeItems(S[name], r);
      if (name === 'vocab') pruneVocab(merged);
      if (name === 'wfb') pruneFb(merged);
      const changed = JSON.stringify(merged) !== JSON.stringify(r);
      S[name] = merged; LS.set('topik.' + name, merged);
      if (changed) persist(name);
    });
    syncState = 'remote'; renderSync(); refreshCounts(); if (!document.activeElement || !/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)) route();
  } catch (e) { remote = null; }
}
function renderSync() { const n = $('#syncLine'); if (n) n.textContent = syncState === 'remote' ? '做题进度、生词本和写作草稿已保存到你的账号，只有你自己能看到，换设备打开也在。' : '做题进度、生词本和写作草稿保存在这个浏览器里。'; }
function pruneFb(v) { const ks = Object.keys(v).sort((a, b) => ((v[b] && v[b].t) || 0) - ((v[a] && v[a].t) || 0)); ks.slice(24).forEach(k => delete v[k]); return v; }

/* ---------------- data ---------------- */
async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); }
async function loadBase() { [INDEX, DICT] = await Promise.all([getJSON('data/index.json'), getJSON('data/dict.json')]); }
async function loadExam(id) { if (!EX[id]) EX[id] = getJSON('data/e' + id + '.json').then(d => { d.qmap = {}; d.groups.forEach(g => g.qs.forEach(q => { d.qmap[q.n] = { q, g }; })); return d; }); return EX[id]; }
const meta = id => INDEX.find(x => x.id === id);

/* ---------------- progress helpers ---------------- */
const pk = (id, n) => id + '-' + n;
const choice = (id, n) => (S.progress[pk(id, n)] || {}).c || 0;
function examStats(id, data) {
  let ans = 0, ok = 0, bad = 0; const m = meta(id);
  for (let n = 1; n <= 50; n++) {
    if (m.skip.includes(n)) continue;
    const c = choice(id, n); if (!c) continue; ans++;
    const a = data ? data.qmap[n].q.ans : (S.progress[pk(id, n)] || {}).a;
    if (c === a) ok++; else bad++;
  }
  return { ans, ok, bad, total: m.answerable };
}
function wrongList() { const out = []; for (const k in S.progress) { const v = S.progress[k]; if (v && v.c && v.a && v.c !== v.a) { const [id, n] = k.split('-').map(Number); out.push({ id, n, c: v.c, a: v.a, t: v.t }); } } return out.sort((x, y) => ORDER.indexOf(x.id) - ORDER.indexOf(y.id) || x.n - y.n); }
function vocabList() { return Object.values(S.vocab).filter(v => v && !v.d).sort((a, b) => b.t - a.t); }
function refreshCounts() {
  const w = wrongList().length, v = vocabList().length;
  $('#nWrong').textContent = w ? w : ''; $('#nVocab').textContent = v ? v : '';
}
function firstOpen(id) { const m = meta(id); for (let n = 1; n <= 50; n++) if (!m.skip.includes(n) && !choice(id, n)) return n; return 0; }
function nextTarget() {
  // resume the exam answered most recently, then the ones after it, then wrap around
  let last = null, lastN = 0, lt = 0;
  for (const k in S.progress) { const v = S.progress[k]; if (v && v.c && v.t > lt) { lt = v.t; [last, lastN] = k.split('-').map(Number); } }
  if (last && ORDER.includes(last)) {
    const m = meta(last);
    for (let n = lastN + 1; n <= 50; n++) if (!m.skip.includes(n) && !choice(last, n)) return { id: last, n };
  }
  const start = last && ORDER.includes(last) ? ORDER.indexOf(last) : 0;
  for (let i = 0; i < ORDER.length; i++) { const id = ORDER[(start + i) % ORDER.length]; const n = firstOpen(id); if (n) return { id, n }; }
  return null;
}

/* ---------------- token rendering ---------------- */
const savedLemma = new Set();
function rebuildSaved() { savedLemma.clear(); vocabList().forEach(v => savedLemma.add(v.ty + ':' + v.k)); }
function isSavedA(a) { const [ws, gs, ps] = DICT.A[a]; return ws.some(i => savedLemma.has('w:' + DICT.W[i][0])) || ps.some(i => savedLemma.has('p:' + DICT.P[i][0])) || gs.some(i => savedLemma.has('g:' + DICT.G[i][0])); }
function fill(node, tokens) {
  let ul = null;
  tokens.forEach((tk, i) => {
    const [s, a, u] = tk; let n;
    if (s.startsWith('(____)')) {
      n = document.createDocumentFragment(); const b = el('span', 'blank'); b.append('(', el('span', 'gap'), ')'); n.append(b);
      const rest = s.slice(6);
      if (rest) { if (a >= 0 && /[가-힣]/.test(rest)) { const w = el('span', 'w', rest); w.dataset.a = a; if (isSavedA(a)) w.classList.add('saved'); n.append(w); } else n.append(rest); }
    }
    else if (a >= 0) { n = el('span', 'w', s); n.dataset.a = a; if (isSavedA(a)) n.classList.add('saved'); }
    else if (/^\((가|나|다|라|㉠|㉡|㉢|㉣)\)/.test(s)) n = el('span', 'mk', s);
    else n = document.createTextNode(s);
    if (u) { if (ul && tokens[i - 1] && tokens[i - 1][2]) ul.append(' ', n); else { if (i) node.append(' '); ul = el('span', 'ul'); ul.append(n); node.append(ul); } return; }
    ul = null; if (i) node.append(' '); node.append(n);
  });
  return node;
}
function richText(node, text) {
  text.split(/(「[^」]*」|__.+?__)/).forEach(part => {
    if (/^「[^」]*[가-힣][^」]*」$/.test(part)) node.append(el('span', 'koq', part));
    else if (/^__.+__$/.test(part)) node.append(el('span', 'ul', part.slice(2, -2)));
    else if (part) node.append(part);
  });
  return node;
}
function expDetail(lines) {
  const d = el('div', 'expd');
  lines.forEach(l => {
    let m = l.match(/^([①②③④])([○×])\s*(.*)$/);
    if (m) { const r = el('div', 'eo ' + (m[2] === '○' ? 'ok' : 'no')); r.append(el('span', 'c', String('①②③④'.indexOf(m[1]) + 1))); r.append(richText(el('span'), m[3])); d.append(r); return; }
    m = l.match(/^(思路|关键句|词汇|语法|注意)：\s*(.*)$/);
    const p = el('p'); if (m) { p.append(el('b', '', m[1])); richText(p, m[2]); } else richText(p, l);
    d.append(p);
  });
  return d;
}
function zhLine(text, tag) {
  const d = el(tag || 'div', 'zh'); if (!text) return d;
  text.split(/(__.+?__)/).forEach(part => { if (/^__.+__$/.test(part)) d.append(el('span', 'ul', part.slice(2, -2))); else if (part) d.append(part); });
  return d;
}
function para(tokens, src, cls, tag) { const p = el(tag || 'p', cls); p.dataset.src = src; return fill(p, tokens); }
function plain(tokens) { return tokens.map(t => t[0]).join(' ').replace(/\(____\)/g, '(　　)'); }
function markSaved() { document.querySelectorAll('.w').forEach(w => w.classList.toggle('saved', isSavedA(+w.dataset.a))); }

/* ---------------- dictionary popover ---------------- */
const pop = $('#pop'); let popFor = null, popTimer = 0, pinned = false;
function naver(q) { return 'https://korean.dict.naver.com/kozhdict/#/search?query=' + encodeURIComponent(q); }
function ctxOf(span) {
  const p = span.closest('[data-src]'); if (!p) return { ctx: '', src: '' };
  const full = p.textContent.replace(/\s+/g, ' ').trim(); const s = span.textContent; const i = full.indexOf(s);
  let a = Math.max(0, i - 36), b = Math.min(full.length, i + s.length + 36);
  return { ctx: (a > 0 ? '…' : '') + full.slice(a, b) + (b < full.length ? '…' : ''), src: p.dataset.src || '', hit: s };
}
function starBtn(ty, k, zh, span) {
  const key = ty + ':' + k; const b = el('button', 'star'); b.type = 'button';
  const sync = () => { const on = savedLemma.has(key); b.classList.toggle('on', on); b.textContent = on ? '★ 已收藏' : '☆ 生词本'; b.setAttribute('aria-pressed', on); };
  sync();
  b.addEventListener('click', ev => {
    ev.stopPropagation();
    const now = Date.now();
    if (savedLemma.has(key)) { S.vocab[key] = Object.assign({}, S.vocab[key], { d: 1, t: now }); toast('已从生词本移除'); }
    else { const c = ctxOf(span); S.vocab[key] = { k, ty, zh, ctx: c.ctx, hit: c.hit, src: c.src, t: now }; toast('已加入生词本'); }
    persist('vocab'); rebuildSaved(); sync(); markSaved(); refreshCounts();
  });
  return b;
}
function showPop(span, pin) {
  const a = +span.dataset.a; const [ws, gs, ps] = DICT.A[a];
  if (popFor) popFor.classList.remove('on');
  popFor = span; pinned = pin; span.classList.add('on');
  pop.replaceChildren();
  const hd = el('div', 'hd'); hd.append(el('span', 'sf', span.textContent));
  if (touch || pin) { const x = el('button', 'x', '✕'); x.type = 'button'; x.setAttribute('aria-label', '关闭'); x.addEventListener('click', ev => { ev.stopPropagation(); hidePop(); }); hd.append(x); }
  pop.append(hd);
  ws.forEach(i => { const [k, zh] = DICT.W[i]; const r = el('div', 'row'); r.append(el('div', 'lem', k), el('div', 'zh', zh || '（暂无释义）'), starBtn('w', k, zh, span)); pop.append(r); });
  if (gs.length) { const sec = el('div', 'sec'); sec.append(el('div', 'sh', '语法')); gs.forEach(i => { const [k, zh] = DICT.G[i]; const r = el('div', 'row'); r.append(el('div', 'gl', k), el('div', 'zh', zh), starBtn('g', k, zh, span)); sec.append(r); }); pop.append(sec); }
  if (ps.length) { const sec = el('div', 'sec'); sec.append(el('div', 'sh', '惯用表达')); ps.forEach(i => { const [k, zh] = DICT.P[i]; const r = el('div', 'row'); r.append(el('div', 'gl', k), el('div', 'zh', zh), starBtn('p', k, zh, span)); sec.append(r); }); pop.append(sec); }
  const ft = el('div', 'ft'); const lk = el('a', '', '在 Naver 韩中词典查看 ↗'); lk.href = naver(ws.length ? DICT.W[ws[0]][0] : span.textContent); lk.target = '_blank'; lk.rel = 'noopener'; ft.append(lk); pop.append(ft);
  pop.classList.toggle('sheet', touch); pop.hidden = false;
  if (!touch) {
    const r = span.getBoundingClientRect(); const pw = pop.offsetWidth, ph = pop.offsetHeight;
    let x = r.left + window.scrollX; x = Math.max(window.scrollX + 8, Math.min(x, window.scrollX + document.documentElement.clientWidth - pw - 8));
    let y = r.bottom + window.scrollY + 6; if (r.bottom + ph + 12 > window.innerHeight && r.top > ph + 70) y = r.top + window.scrollY - ph - 6;
    pop.style.left = x + 'px'; pop.style.top = y + 'px';
  } else { pop.style.left = ''; pop.style.top = ''; }
}
function hidePop() { clearTimeout(popTimer); pop.hidden = true; pinned = false; if (popFor) popFor.classList.remove('on'); popFor = null; }
document.addEventListener('mouseover', e => {
  if (touch || !DICT) return;
  const w = e.target.closest && e.target.closest('.w');
  if (e.target.closest && e.target.closest('#pop')) { clearTimeout(popTimer); return; }
  if (!w) return;
  clearTimeout(popTimer);
  if (pinned && popFor !== w) return;
  popTimer = setTimeout(() => showPop(w, false), 130);
});
document.addEventListener('mouseout', e => {
  if (touch || pinned) return;
  const from = e.target.closest && e.target.closest('.w, #pop'); if (!from) return;
  const to = e.relatedTarget;
  if (to && to.closest && (to.closest('#pop') || to === popFor)) return;
  clearTimeout(popTimer); popTimer = setTimeout(hidePop, 260);
});

/* ---------------- toast ---------------- */
let toastT = 0; function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 1600); }

/* ---------------- views ---------------- */
const view = $('#view');

async function renderExam(id, n) {

  } else if (g.pas.length) { const ps = el('div', 'ko passage'); g.pas.forEach((p, i) => { ps.append(para(p, src)); if (zhOn && g.pasZh) ps.append(zhLine(g.pasZh[i])); }); card.append(ps); }
  const body = el('div', 'ko');

  else if (inlineFirst && q.text.length === 1) { const p = para(q.text[0], src); p.style.margin = '0'; ql.append(p); }

  tg.addEventListener('click', () => { side.classList.toggle('fold'); tg.textContent = side.classList.contains('fold') ? '展开题号' : '收起'; });

    const b = el('button', '', String(k)); b.type = 'button'; b.dataset.go = k; const qq = data.qmap[k].q; const ck = choice(id, k);
    if (!qq.ans) b.className = 'skip'; else if (ck) b.className = ck === qq.ans ? 'ok' : 'bad';
    if (k === n) b.classList.add('cur'); b.setAttribute('aria-label', '第' + k + '题'); cells.append(b);
  }

let cur = null;

function answer(i) {
  if (!cur || !cur.q.ans) return;
  const { id, n, q } = cur; if (choice(id, n)) return;
  S.progress[pk(id, n)] = { c: i, a: q.ans, t: Date.now() };
  persist('progress'); refreshCounts();
  const y = window.scrollY; renderExam(id, n).then(() => { window.scrollTo(0, y); const nb = $('#nextBtn'); if (nb) nb.focus({ preventScroll: true }); });
}
function toggleZh() { if (!cur || !cur.q.zh) return; LS.set('topik.zh', !LS.get('topik.zh', false)); const y = window.scrollY; renderExam(cur.id, cur.n).then(() => window.scrollTo(0, y)); }
function redo() { if (!cur) return; const { id, n } = cur; S.progress[pk(id, n)] = { c: 0, t: Date.now() }; persist('progress'); refreshCounts(); const y = window.scrollY; renderExam(id, n).then(() => window.scrollTo(0, y)); }

async function renderResult(id) {
  setNav('home'); const data = await loadExam(id); const m = meta(id); const st = examStats(id, data);
  view.replaceChildren();
  const card = el('section', 'card res'); card.style.maxWidth = '46rem';
  card.append(el('h1', '', m.title + ' 成绩'));
  const big = el('div', 'big', String(st.ok * 2)); big.append(el('span', 'muted', ' / ' + st.total * 2)); card.append(big);
  card.append(el('p', 'muted', `已答 ${st.ans}/${st.total} 题，正确 ${st.ok} 题，错 ${st.bad} 题。` + (m.skip.length ? `第 ${m.skip.join('、')} 题原卷未公开文章，不计分。` : '')));
  const wr = []; const un = [];
  for (let n = 1; n <= 50; n++) { const q = data.qmap[n].q; if (!q.ans) continue; const c = choice(id, n); if (!c) un.push(n); else if (c !== q.ans) wr.push(n); }
  if (wr.length) { const p = el('div', 'cells'); p.style.gridTemplateColumns = 'repeat(auto-fill,minmax(2.2rem,1fr))'; wr.forEach(n => { const b = el('button', 'bad', String(n)); b.type = 'button'; b.dataset.goto = id + '-' + n; p.append(b); }); card.append(el('div', 'sh', '错题（点击查看）')); card.append(p); }
  if (un.length) card.append(el('p', 'muted', '还有 ' + un.length + ' 题没答：' + un.slice(0, 20).join('、') + (un.length > 20 ? '…' : '')));
  const acts = el('div', 'qnav');
  const b1 = el('a', 'btn', '← 回到第1题'); b1.href = '#e' + id + '-1';
  const pi = ORDER.indexOf(id); const b2 = el('a', 'btn pri', pi < ORDER.length - 1 ? '下一回：' + meta(ORDER[pi + 1]).title + ' →' : '去错题本复习 →'); b2.href = pi < ORDER.length - 1 ? '#e' + ORDER[pi + 1] + '-1' : '#wrong';
  acts.append(b1, b2); card.append(acts);
  const rs = el('button', 'btn sm ghost', '清空本回作答记录，重新做'); rs.type = 'button'; rs.dataset.act = 'reset'; rs.dataset.id = id; card.append(rs);
  view.append(card);
}

const typeName = (W, t) => (W.guide[t] && W.guide[t].h) || '';

function wcount(s) { return (s || '').replace(/\r?\n/g, '').length; }
let wsaveT = 0;
function saveDraft(id, patch) {

function T(v) { return v && typeof v === 'object' && v.t ? fill(el('span'), v.t) : document.createTextNode(v == null ? '' : String(v)); }

function renderChart(c) {

  if (c.type === 'tree') {

function renderPanel(p) {

function lineSvg(p, unit) {
  const NS = 'http://www.w3.org/2000/svg', W = 560, H = 236, L = 44, R = 44, TP = 34, B = 48;
  const vals = p.items.map(x => x[1]), n = vals.length, max = Math.max(...vals) * 1.15, fc = p.forecast == null ? n : p.forecast;
  const X = i => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)), Y = v => TP + (H - TP - B) * (1 - v / max);
  const mk = (tag, at, cls) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (cls) e.setAttribute('class', cls); return e; };
  const svg = mk('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': P(p.title) + '：' + p.items.map((x, i) => P(x[0]) + ' ' + x[1] + unit + (i >= fc ? '（预测）' : '')).join('，') }, 'lsvg');
  svg.append(mk('line', { x1: L - 20, x2: W - R + 20, y1: H - B, y2: H - B }, 'axis'));
  for (let i = 0; i < n - 1; i++) svg.append(mk('line', { x1: X(i), y1: Y(vals[i]), x2: X(i + 1), y2: Y(vals[i + 1]) }, 'seg' + (i + 1 >= fc ? ' dash' : '')));
  p.items.forEach((x, i) => {
    svg.append(mk('circle', { cx: X(i), cy: Y(vals[i]), r: 5.5 }, 'pt'));
    const v = mk('text', { x: X(i), y: Y(vals[i]) - 13 }, 'vl'); v.textContent = vals[i] + unit; svg.append(v);
    const t = mk('text', { x: X(i), y: H - B + 22 }, 'xl'); t.textContent = P(x[0]); svg.append(t);
    if (i >= fc) { const e = mk('text', { x: X(i), y: H - B + 40 }, 'xl'); e.textContent = '(예상)'; svg.append(e); }
  });
  return svg;
}
function chartPlain(c) {
  const out = [];
  if (c.type === 'tree') { out.push(P(c.root)); c.nodes.forEach(n => out.push('- ' + P(n.h) + '（' + P(n.sub) + '）：' + n.lines.map(P).join(' '))); return out.join('\n'); }
  if (c.title) out.push(P(c.title)); if (c.note) out.push(P(c.note));
  (c.panels || []).forEach(p => {
    const u = P(p.unit || ''); out.push('[' + P(p.title) + ']');
    if (p.type === 'gbar') p.items.forEach(it => out.push('- ' + P(it[0]) + ': ' + p.series.map((s, i) => P(s) + ' ' + it[i + 1] + u).join(', ')));
    else p.items.forEach((it, i) => out.push('- ' + P(it[0]) + ': ' + it[1] + u + (p.forecast != null && i >= p.forecast ? '（预测）' : '')));
  });
  (c.boxes || []).forEach(b => out.push('[' + P(b.h) + '] ' + b.lines.map(P).join(' / ')));

}

/* 원고지 (manuscript paper) preview: 20 cells a row, paragraph indent, two digits/latin letters share a cell */
function gaoji(text, minCells) {
  const cells = [];
  text.split(/\n+/).map(x => x.trim()).filter(Boolean).forEach(p => {
    while (cells.length % 20) cells.push('');
    cells.push('');
    for (let i = 0; i < p.length;) {
      const ch = p[i];
      if (ch === ' ' && cells.length % 20 === 0) { i++; continue; }
      if (/[0-9A-Za-z]/.test(ch) && /[0-9A-Za-z]/.test(p[i + 1] || '')) { cells.push(ch + p[i + 1]); i += 2; continue; }
      cells.push(ch); i++;
    }
  });
  let used = cells.length; while (used && cells[used - 1] === '') used--;
  while (cells.length < minCells || cells.length % 20) cells.push('');
  const g = el('div', 'wgj'); g.setAttribute('aria-hidden', 'true');
  cells.forEach((c, i) => { const sp = el('span', (i + 1) % 100 === 0 ? 'c100' : '', c); g.append(sp); });
  return { g, used };
}

  if (it.type <= 52) {
    L.push('【参考答案】\n㉠ ' + it.a[0].v.join(' / ') + '\n㉡ ' + it.a[1].v.join(' / '));
    L.push('【学生作答】\n㉠ ' + ((ans[0] || '').trim() || '（未作答）') + '\n㉡ ' + ((ans[1] || '').trim() || '（未作答）'));
    L.push('', '评分标准：每空5分。意思符合上下文、语法正确、文体正确（' + (it.type === 51 ? '51题用“-(스)ㅂ니다”等正式敬语' : '52题用“-다”体') + '）才给满分；意思对但语法或文体有错扣1～3分。参考答案只是示例，意思合适的其他写法同样给分。');
    L.push('请严格按下面的格式输出，不要使用 Markdown 符号（不要用 #、*、表格）：\n【得分】㉠ x/5，㉡ x/5\n【㉠ 点评】内容是否符合上下文、文体是否正确、有什么语法错误\n【㉠ 修改】改好的句子（如果已经很好就写原句）\n【㉡ 点评】……\n【㉡ 修改】……\n【小贴士】一句话说明这类题下次要注意什么');
  } else {
    const n = wcount(ans);
    L.push('【参考范文】（仅供参考，学生不必写得一样）\n' + it.m.map(m => m.ko).join('\n'));
    L.push('【学生作答】（' + n + '字）\n' + (ans.trim() || '（未作答）'));
    const rub = it.type === 53 ? '内容及任务完成 x/7，文章结构 x/7，语言使用 x/16' : '内容及任务完成 x/12，文章结构 x/12，语言使用 x/26';
    L.push('', '请按 TOPIK 评分标准（' + rub.replace(/ x/g, '') + '）评分。字数不在要求范围内要扣分；' + (it.type === 53 ? '53题不应写个人观点，图表信息不能漏写或写错。' : '54题要回答题目里的每个问题，开头、正文、结尾结构要清楚，不能照抄题目。') + '全文应使用“-다”体（한다체）。');
    L.push('请严格按下面的格式输出，不要使用 Markdown 符号（不要用 #、*、表格）：\n【估计得分】x/' + FULL[it.type] + '（' + rub + '）——一句话总评\n【主要问题】逐条列出，最多8条，每条一行：原句 → 修改 ｜ 原因\n【修改后的全文】保留学生的意思和结构，改成通顺、地道的书面语，段落之间空一行\n【可以学的表达】2～3个，每个一行：韩语表达 ｜ 中文意思\n如果学生几乎没写，就直接说明，并给出写作思路和开头的第一句示范。');
  }
  return L.join('\n');
}
function renderAiText(node, text) {
  node.replaceChildren();
  text.split('\n').forEach(line => {
    const m = line.match(/^(【[^】]+】)(.*)$/);
    if (m) { const d = el('div', 'ah'); d.append(m[1]); if (m[2].trim()) { d.append(' '); const sp = el('span'); sp.style.fontWeight = '400'; sp.style.color = 'var(--ink)'; sp.textContent = m[2].trim(); d.append(sp); } node.append(d); return; }
    if (!line.trim()) { node.append(el('div', '', ' ')); return; }
    const hang = (line.match(/[가-힣]/g) || []).length; const d = el('div', hang > line.length * 0.4 ? 'kl' : '', line); node.append(d);
  });
}
function fmtTime(t) { const d = new Date(t); const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function showSavedFb(box, it) {
  const fb = S.wfb[it.id]; if (!fb || !fb.x) return;
  box.hidden = false; box.replaceChildren();
  const hd = el('div', 'ahd'); hd.append(el('span', 'lab', 'AI 批改'), '上次批改：' + fmtTime(fb.t));
  const cur2 = JSON.stringify(wcur && wcur.getAns ? wcur.getAns() : null);
  if (fb.s && cur2 !== fb.s) hd.append(el('span', 'tag', '作答已修改，可以重新批改'));
  box.append(hd); const out = el('div', 'out'); renderAiText(out, fb.x); box.append(out);
}
function showAiRun(box) {
  box.hidden = false; box.replaceChildren();
  const hd = el('div', 'ahd'); hd.append(el('span', 'lab', 'AI 批改'));
  const st = el('button', 'btn sm', '停止'); st.type = 'button'; st.dataset.act = 'wstop'; hd.append(st); box.append(hd);
  const out = el('div', 'out'); if (aiRun.text) renderAiText(out, aiRun.text); else out.append(el('div', 'thinking', '正在批改…（第一次使用时，Claude 会先询问是否允许本页面使用你的 Claude 用量）'));
  box.append(out); aiRun.node = out; aiRun.box = box;
}
const AI_ERR = {
  rate_limited: '请求太频繁，或已达到你的 Claude 用量上限，请稍后再试。',
  session_expired: '登录已过期，请重新登录 claude.ai 后再试。',
  refused: '这次没有得到批改结果，请修改作答后再试。',
  empty_completion: '这次没有得到批改结果，请修改作答后再试。',
  prompt_too_large: '作答太长了，请删减后再试。'
};
async function runAi() {
  if (!wcur || !SAMPLE || aiRun) return;
  const { id, it } = wcur; const ans = wcur.getAns();
  const empty = it.type <= 52 ? !ans.some(x => x && x.trim()) : !ans.trim();
  if (empty) { toast('先写一点再批改吧'); return; }
  const ctl = new AbortController(); aiRun = { id, ctl, text: '', node: null }; refreshAi();
  const box = $('#aibox'); if (box) showAiRun(box);
  try {
    const { text } = await SAMPLE(aiPrompt(it, ans), { signal: ctl.signal, onText: ({ text }) => { aiRun.text = text; if (aiRun.node && aiRun.node.isConnected) renderAiText(aiRun.node, text); } });
    S.wfb[id] = { x: text, t: Date.now(), s: JSON.stringify(ans) }; pruneFb(S.wfb); persist('wfb');
    aiRun = null; refreshAi();
    if (wcur && wcur.id === id) { const b = $('#aibox'); if (b) showSavedFb(b, it); }
  } catch (e) {
    const code = e && e.code; const partial = e && e.text; aiRun = null;
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) SAMPLE = null;
    refreshAi();
    const b = wcur && wcur.id === id ? $('#aibox') : null; if (!b) return;
    if (code === 'cancelled') { if (partial) { b.querySelector('.ahd .btn') && b.querySelector('.ahd .btn').remove(); b.append(el('div', 'wnote', '已停止。')); } else { b.hidden = true; if (S.wfb[id]) showSavedFb(b, it); } return; }
    const hd = b.querySelector('.ahd .btn'); if (hd) hd.remove();
    if (!partial) { const out = b.querySelector('.out'); if (out) out.replaceChildren(); }
    const msg = SAMPLE === null ? '没有获得使用 Claude 的许可，AI 批改在本次打开期间不可用。可以对照参考答案自己检查。' : (AI_ERR[code] || '网络或服务出错，可以再点一次「AI 批改」。');
    b.append(el('div', 'err', msg));
  }
}

/* ---------------- routing & events ---------------- */
async function route() {
  hidePop(); wcur = null;
  if (!INDEX) return;
  const h = (location.hash || '#home').slice(1);
  let m;
  try {
    if ((m = h.match(/^e(\d+)-(\d+)$/)) && ORDER.includes(+m[1])) await renderExam(+m[1], +m[2]);
    else if ((m = h.match(/^e(\d+)$/)) && ORDER.includes(+m[1])) await renderExam(+m[1], S.pos[m[1]] || 1);
    else if ((m = h.match(/^r(\d+)$/)) && ORDER.includes(+m[1])) await renderResult(+m[1]);
    else if (h === 'wrong') { cur = null; await renderWrong(); }
    else if (h === 'vocab') { cur = null; renderVocab(); }
    else if (h === 'write') { cur = null; await renderWHome(); }
    else if ((m = h.match(/^w\/(5[1-4]-\w+)$/))) { cur = null; await renderWItem(m[1]); }
    else if (h.startsWith('w/')) { cur = null; await renderWHome(); }
    else { cur = null; renderHome(); }
  } catch (err) { view.replaceChildren(el('p', 'loading', '题目文件没有载入成功，请刷新页面再试。')); }
}
window.addEventListener('hashchange', () => { route().then(() => window.scrollTo(0, 0)); });

document.addEventListener('click', e => {
  const t = e.target; if (!(t instanceof Element)) return;
  if (t.closest('#pop')) return;
  const w = t.closest('.w'); const opt = t.closest('.opt');
  if (w && (touch || !opt || opt.closest('.answered'))) { e.preventDefault(); if (popFor === w && pinned) hidePop(); else showPop(w, true); return; }
  if (!pop.hidden) hidePop();
  if (opt && !opt.disabled && !opt.closest('.answered')) { answer(+opt.dataset.i); return; }
  const go = t.closest('[data-go]'); if (go && cur) { location.hash = '#e' + cur.id + '-' + go.dataset.go; return; }
  const gt = t.closest('[data-goto]'); if (gt) { location.hash = '#e' + gt.dataset.goto; return; }
  const act = t.closest('[data-act]'); if (!act) return;
  const a = act.dataset.act;
  if (a === 'zh') toggleZh();
  else if (a === 'wzh') toggleWZh();
  else if (a === 'wai') runAi();
  else if (a === 'wstop') { if (aiRun) aiRun.ctl.abort(); }
  else if (a === 'wclear') { if (!wcur) return; if (!act.dataset.sure) { act.dataset.sure = 1; act.textContent = '确定清空？'; setTimeout(() => { if (act.isConnected) { delete act.dataset.sure; act.textContent = '清空'; } }, 3000); return; } const id = wcur.id; saveDraft(id, { a: ['', ''], x: '', o: ['', '', ''] }); renderWItem(id); toast('已清空'); }
  else if (a === 'redo') redo();
  else if (a === 'redoat') { const k = act.dataset.k; S.progress[k] = { c: 0, t: Date.now() }; persist('progress'); refreshCounts(); location.hash = '#e' + k; }
  else if (a === 'reset') { const id = +act.dataset.id; for (let n = 1; n <= 50; n++) if (S.progress[pk(id, n)]) S.progress[pk(id, n)] = { c: 0, t: Date.now() }; persist('progress'); refreshCounts(); location.hash = '#e' + id + '-1'; }
  else if (a === 'vdel') { const k = act.dataset.k; S.vocab[k] = Object.assign({}, S.vocab[k], { d: 1, t: Date.now() }); persist('vocab'); rebuildSaved(); refreshCounts(); renderVocab(); toast('已移除'); }
  else if (a === 'hidezh') { const vl = $('.vlist'); const on = !vl.classList.contains('hidezh'); vl.classList.toggle('hidezh', on); LS.set('topik.hidezh', on); act.textContent = on ? '显示中文' : '遮住中文自测'; }
  else if (a === 'copy') {
    const txt = vocabList().map(v => [v.k, v.zh, v.ctx || ''].join('\t')).join('\n');
    const fallback = () => { let box = $('.copybox'); if (!box) { box = el('textarea', 'copybox'); box.readOnly = true; act.closest('.toolbar').after(box); } box.value = txt; box.focus(); box.select(); toast('已选中全部内容，按 Ctrl/⌘+C 复制'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('已复制 ' + vocabList().length + ' 条（可粘贴到 Excel / Anki）'), fallback); } catch (err) { fallback(); }
  }
});
document.addEventListener('click', e => { const z = e.target instanceof Element && e.target.closest('.hidezh .zh'); if (z) z.classList.toggle('show'); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hidePop(); return; }
  if (wcur && !e.altKey && !e.ctrlKey && !e.metaKey && (e.key === 't' || e.key === 'T') && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) { toggleWZh(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey || !cur) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) return;
  if (/^[1-4]$/.test(e.key)) { answer(+e.key); e.preventDefault(); }
  else if (e.key === 't' || e.key === 'T') toggleZh();
  else if (e.key === 'ArrowRight') { const nb = $('#nextBtn'); if (nb) location.hash = nb.getAttribute('href'); }
  else if (e.key === 'ArrowLeft') { const pb = $('.qnav .btn'); if (pb && pb.getAttribute('href')) location.hash = pb.getAttribute('href'); }
});
window.addEventListener('resize', () => { if (!pop.hidden && !touch) hidePop(); });

(async function start() {
  try { await loadBase(); } catch (err) { view.replaceChildren(el('p', 'loading', '题库载入失败。如果是直接双击打开的本地文件，请改用 GitHub Pages 或本地服务器（python3 -m http.server）打开。')); return; }
  rebuildSaved(); refreshCounts();
  // demo sentence from exam 83 Q3
  loadExam(83).then(d => { demoCache = d.qmap[3].q.text[0]; if ((location.hash || '#home') === '#home' || location.hash === '') { const ex = $('.demo .ex'); if (ex && !ex.childNodes.length) ex.append(para(demoCache, '83-3')); } });
  await route();
  initRemote(); initSample();
})();
})();
